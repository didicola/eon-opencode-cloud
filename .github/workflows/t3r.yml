name: t3r-cloud
on:
  workflow_dispatch:
  schedule:
    # Four chances/day. The script itself waits for the 24h+120s windows.
    - cron: "17 */6 * * *"
concurrency:
  group: t3r-cloud
  cancel-in-progress: false
permissions:
  contents: write
env:
  PYTHONUNBUFFERED: "1"
jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Verify frozen inputs
        run: |
          set -eu
          test "$(sha256sum t3r/t3r_harness.py | awk '{print $1}')" = "a4826b7e0d0a91f37e1f20cded196a77f83b1f91e7532aa76ca6658fdca93661"
          test "$(sha256sum t3r/t3_c3_harness.py | awk '{print $1}')" = "2be911896c2fcdf1a627dbbe7d3c828998da1aa4dee950ce1f3e2dfcd066876d"
          test "$(sha256sum t3r/coverage_instrument.py | awk '{print $1}')" = "98a190c1a8312e949a0396193f53b51c8f56467aeadd2aeaf279c7d855676344"
          test "$(sha256sum t3r/T3-R-PREREG-20261025.md | awk '{print $1}')" = "556fe509327c65aebddc038c4090644afc9017044064c6d677c12caf177f0c0d"
          test "$(sha256sum t3r/inventory/epoch4-hosts-20261023.txt | awk '{print $1}')" = "40dab1c02fcf1fe883972ec7e617aae0de8983372d716463faeb30ea01dd358c"
      - name: Stage admin token (never printed)
        env:
          MCP_ADMIN_TOKEN: ${{ secrets.MCP_ADMIN_TOKEN }}
        run: |
          set -eu
          test -n "${MCP_ADMIN_TOKEN:-}"
          mkdir -p "$HOME/eon-tmp"
          printf '%s' "$MCP_ADMIN_TOKEN" > "$HOME/eon-tmp/.adm"
          chmod 600 "$HOME/eon-tmp/.adm"
          test "$(stat -c '%a' "$HOME/eon-tmp/.adm")" = "600"
      - name: Run due cycle
        id: run
        run: |
          set +e
          python3 t3r/run_cycle.py
          rc=$?
          echo "rc=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate C1b durable token
        id: valid
        if: always()
        run: |
          set +e
          if [ -f t3r/evidence/epoch5/t3r-C1b.json ] && [ ! -f t3r/evidence/epoch5/t3r-C1b-validity.json ]; then
            python3 t3r/check_c1b.py
            rc=$?
            echo "vrc=$rc" >> "$GITHUB_OUTPUT"
          fi
          exit 0
      - name: Commit evidence
        if: always()
        run: |
          set -e
          git config user.name "eon-t3r-runner"
          git config user.email "eon-t3r-runner@users.noreply.github.com"
          git add -A t3r/evidence/epoch5
          if git diff --cached --quiet; then
            echo "no evidence changes"
          else
            git commit -m "t3r: cloud cycle evidence $(date -u +%FT%TZ)"
            git push
          fi
      - name: Surface failures
        if: always()
        run: |
          rc="${{ steps.run.outputs.rc }}"
          vrc="${{ steps.valid.outputs.vrc }}"
          echo "run_rc=${rc:-none} valid_rc=${vrc:-none}"
          if [ -n "$rc" ] && [ "$rc" != "0" ]; then exit 1; fi
          if [ -n "$vrc" ] && [ "$vrc" != "0" ]; then exit 1; fi
