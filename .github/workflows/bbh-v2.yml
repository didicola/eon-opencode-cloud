name: bbh-v2
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      batch:
        description: 'max questions this run'
        required: false
        default: '400'
concurrency:
  group: bbh-v2
  cancel-in-progress: false
permissions:
  contents: write
jobs:
  bbh:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - name: run batch
        env:
          EON_ADM: ${{ secrets.EON_ADM }}
        run: |
          python3 bbh-v2/bbh-v2-cloud.py --batch "${{ github.event.inputs.batch || '150' }}"
      - name: commit results
        run: |
          git config user.name "bbh-bot"
          git config user.email "bbh-bot@users.noreply.github.com"
          git add bbh-v2/runs/
          git diff --cached --quiet || git commit -m "bbh-v2 batch $(date -u +%Y%m%dT%H%M%SZ)"
          git push
