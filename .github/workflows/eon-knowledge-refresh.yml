name: EON Knowledge Refresh

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: eon-knowledge-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Refresh knowledge cards
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BETTERSTACK_TOKEN: ${{ secrets.BETTERSTACK_TOKEN }}
          EON_ADM_TOKEN: ${{ secrets.EON_ADM_TOKEN }}
        run: python3 scripts/refresh-eon-knowledge-ci.py
